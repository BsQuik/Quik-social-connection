<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Statistiche · BsQuik</title>
<style>
:root{--bg:#F6F2EE;--panel:#fff;--line:#E4DAD2;--text:#1B1613;--muted:#5F544C;--acc:#C8281C;--acct:#B3231A;--s2:#1B1613;--s3:#B9814F;--s4:#5E9B3C;--s5:#8E8179;--s6:#D9B8AE;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12100F;--panel:#1C1917;--line:#2E2925;--text:#F2ECE6;--muted:#B3A99F;--acc:#E0402F;--acct:#FF8472;--s2:#F2ECE6;--s3:#C99560;--s4:#79B655;--s5:#9C8F85;--s6:#6A4B43;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:1100px;margin:0 auto;padding:20px 20px 64px}
h1{margin:0;font-size:clamp(26px,5vw,36px);line-height:1.1}h2{margin:0 0 12px;font-size:18px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}.sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.btn,select,input{font:inherit;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px}
.btn{font-weight:700;cursor:pointer}.btn.red{background:var(--acc);border-color:var(--acc);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}.kpi .card b{display:block;font-size:34px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-bottom:16px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;min-height:34px;font-size:15px}.bar i{display:block;height:14px;border-radius:7px;background:var(--acc);min-width:3px}.bar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.donut svg{width:170px;height:170px;flex:none}.lg{display:grid;gap:6px;font-size:15px;min-width:0}.lg div{display:flex;gap:8px;align-items:center}.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.m{color:var(--muted);font-size:14px}.er{color:var(--acct);min-height:1.5em}svg text{fill:var(--muted);font:12px system-ui,sans-serif}
#login{max-width:420px;margin:12vh auto 0}#login form{display:grid;gap:12px;margin-top:16px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="login" class="card">
  <h1>Statistiche</h1>
  <p class="m">Area privata di BsQuik.</p>
  <form id="lf" autocomplete="on">
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn red" type="submit">Accedi</button>
    <p id="er" class="er" role="alert"></p>
  </form>
</main>

<main id="dash" hidden>
  <div class="top"><h1>Statistiche</h1>
    <div class="sp"><select id="rg" aria-label="Periodo"><option value="7">Ultimi 7 giorni</option><option value="30" selected>Ultimi 30 giorni</option><option value="90">Ultimi 90 giorni</option><option value="365">Ultimo anno</option></select>
    <button class="btn" id="rf" type="button">Aggiorna</button><button class="btn" id="lo" type="button">Esci</button></div></div>
  <p id="de" class="er" role="alert"></p>
  <div class="kpi" id="kp"></div>
  <div class="g2"><section class="card"><h2>Click per giorno</h2><div id="ln"></div></section>
    <section class="card"><h2>Link più cliccati</h2><div id="bl"></div></section></div>
  <div class="g2"><section class="card"><h2>Paesi (quota dei click)</h2><div id="dn"></div></section>
    <section class="card"><h2>Click per paese</h2><div id="bc"></div><p class="m">Il paese è stimato dall’indirizzo IP: non è la nazionalità. “Sconosciuto” = paese non rilevato.</p></section></div>
  <section class="card"><h2>Ultimi eventi</h2><div class="tw"><table><thead><tr><th>Quando</th><th>Evento</th><th>Link</th><th>Versione</th><th>Paese</th><th>IP</th></tr></thead><tbody id="rc"></tbody></table></div></section>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.BSQUIK || {}, U = (C.SUPABASE_URL || '').replace(/\/$/, ''), K = C.SUPABASE_KEY || '';
  var $ = function (i) { return document.getElementById(i); };
  var NAMES = { youtube: 'YouTube', twitch: 'Twitch', tiktok: 'TikTok', discord: 'Discord', whatsapp: 'WhatsApp', reddit: 'Reddit',
    instagram: 'Instagram', website: 'Sito web', subscribe: 'Iscriviti (YouTube)', share: 'Condividi', classic: 'Versione classica', newsite: 'Nuovo sito' };
  var PAGES = { nuovo: 'Nuova', classico: 'Classica' };
  var COL = ['var(--acc)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
  var nf = new Intl.NumberFormat('it-IT');
  var regions; try { regions = new Intl.DisplayNames(['it'], { type: 'region' }); } catch (e) {}
  function country(c) { if (!c || c === 'ZZ') return 'Sconosciuto'; try { return (regions && regions.of(c)) || c; } catch (e) { return c; } }
  function link(l) { return NAMES[l] || l || '—'; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  var NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  /* ---------- accesso (solo fetch, nessuna libreria esterna) ---------- */
  function save(j) { sessionStorage.setItem('bq-s', JSON.stringify({ a: j.access_token, r: j.refresh_token, e: Date.now() + j.expires_in * 1000 })); }
  function auth(body, grant) {
    return fetch(U + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: K, 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.msg || j.error_description || 'Accesso non riuscito'); save(j); }); });
  }
  function token() {
    var s = JSON.parse(sessionStorage.getItem('bq-s') || 'null');
    if (!s) return Promise.resolve(null);
    if (Date.now() < s.e - 30000) return Promise.resolve(s.a);
    return auth({ refresh_token: s.r }, 'refresh_token').then(function () { return JSON.parse(sessionStorage.getItem('bq-s')).a; })
      .catch(function () { sessionStorage.removeItem('bq-s'); return null; });
  }
  function load(days) {
    return token().then(function (t) {
      if (!t) throw new Error('auth');
      return fetch(U + '/rest/v1/rpc/stats', { method: 'POST', headers: { apikey: K, Authorization: 'Bearer ' + t, 'content-type': 'application/json' }, body: JSON.stringify({ p_days: days }) });
    }).then(function (r) {
      if (r.status === 401) { sessionStorage.removeItem('bq-s'); throw new Error('auth'); }
      if (r.status === 403) throw new Error('forbidden');
      if (!r.ok) throw new Error('Errore ' + r.status);
      return r.json();
    });
  }

  /* ---------- grafici in SVG/HTML ---------- */
  function bars(box, rows, label, val, extra) {
    box.textContent = '';
    if (!rows.length) { box.appendChild(el('p', 'm', 'Ancora nessun dato.')); return; }
    var max = Math.max.apply(null, rows.map(val)) || 1;
    rows.slice(0, 10).forEach(function (r) {
      var b = el('div', 'bar'), s = el('span', '', label(r)), t = el('div'), i = el('i');
      i.style.width = Math.max(1, val(r) / max * 100) + '%'; t.appendChild(i);
      b.appendChild(s); b.appendChild(t); b.appendChild(el('em', '', nf.format(val(r)) + (extra ? extra(r) : '')));
      box.appendChild(b);
    });
  }
  function days(n) {
    var out = [], now = Date.now();
    for (var i = n - 1; i >= 0; i--) out.push(new Date(now - i * 864e5).toLocaleDateString('sv-SE', { timeZone: 'Europe/Rome' }));
    return out;
  }
  function line(box, byDay, n) {
    box.textContent = '';
    var list = days(Math.min(n, 90)), m = {};
    byDay.forEach(function (d) { m[d.day] = d; });
    var c = list.map(function (d) { return m[d] ? m[d].clicks : 0; }), v = list.map(function (d) { return m[d] ? m[d].views : 0; });
    var W = 640, H = 230, L = 36, R = 10, T = 12, Bm = 28, max = Math.max.apply(null, c.concat(v), 1);
    var s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': 'Grafico dei click e delle visite per giorno' });
    var x = function (i) { return L + (list.length > 1 ? i * (W - L - R) / (list.length - 1) : 0); };
    var y = function (q) { return T + (H - T - Bm) * (1 - q / max); };
    [0, .5, 1].forEach(function (f) {
      var yy = y(max * f); s.appendChild(svg('line', { x1: L, x2: W - R, y1: yy, y2: yy, stroke: 'var(--line)' }));
      var t = svg('text', { x: L - 6, y: yy + 4, 'text-anchor': 'end' }); t.textContent = Math.round(max * f); s.appendChild(t);
    });
    function path(a, color, w, fill) {
      var d = a.map(function (q, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q).toFixed(1); }).join(' ');
      if (fill) s.appendChild(svg('path', { d: d + ' L' + x(a.length - 1).toFixed(1) + ' ' + y(0) + ' L' + x(0).toFixed(1) + ' ' + y(0) + ' Z', fill: color, opacity: .12 }));
      s.appendChild(svg('path', { d: d, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    }
    path(v, 'var(--s5)', 2, false); path(c, 'var(--acc)', 3, true);
    [0, Math.floor((list.length - 1) / 2), list.length - 1].forEach(function (i) {
      var t = svg('text', { x: x(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === list.length - 1 ? 'end' : 'middle' });
      t.textContent = list[i].slice(8) + '/' + list[i].slice(5, 7); s.appendChild(t);
    });
    box.appendChild(s);
    var k = el('p', 'm'); k.textContent = 'Rosso: click · Grigio: visite'; box.appendChild(k);
  }
  function donut(box, rows) {
    box.textContent = '';
    var tot = rows.reduce(function (a, r) { return a + r.clicks; }, 0);
    if (!tot) { box.appendChild(el('p', 'm', 'Ancora nessun click.')); return; }
    var top = rows.slice(0, 5).map(function (r) { return { n: country(r.country), q: r.clicks }; });
    var rest = tot - top.reduce(function (a, r) { return a + r.q; }, 0);
    if (rest > 0) top.push({ n: 'Altri', q: rest });
    var wrap = el('div', 'donut'), s = svg('svg', { viewBox: '0 0 42 42', role: 'img', 'aria-label': 'Quota dei click per paese' }), acc = 0, lg = el('div', 'lg');
    top.forEach(function (r, i) {
      var p = r.q / tot * 100;
      s.appendChild(svg('circle', { cx: 21, cy: 21, r: 15.915, fill: 'none', stroke: COL[i % COL.length], 'stroke-width': 7, 'stroke-dasharray': p + ' ' + (100 - p), 'stroke-dashoffset': 25 - acc }));
      acc += p;
      var d = el('div'), sw = el('i'); sw.style.background = COL[i % COL.length];
      d.appendChild(sw); d.appendChild(el('span', '', r.n + ' · ' + Math.round(p) + '%')); lg.appendChild(d);
    });
    wrap.appendChild(s); wrap.appendChild(lg); box.appendChild(wrap);
  }
  function render(d) {
    var t = d.totals, k = $('kp'); k.textContent = '';
    [['Click sui link', t.clicks], ['Visualizzazioni', t.views], ['Visitatori unici', t.visitors], ['Click ogni 100 visite', t.views ? Math.round(t.clicks / t.views * 100) : 0]].forEach(function (x) {
      var c = el('div', 'card'); c.appendChild(el('b', '', nf.format(x[1]))); c.appendChild(el('span', '', x[0])); k.appendChild(c);
    });
    line($('ln'), d.by_day, +$('rg').value);
    bars($('bl'), d.by_link, function (r) { return link(r.link); }, function (r) { return r.clicks; });
    donut($('dn'), d.by_country);
    bars($('bc'), d.by_country, function (r) { return country(r.country); }, function (r) { return r.clicks; }, function (r) { return ' · ' + nf.format(r.views) + ' visite'; });
    var tb = $('rc'); tb.textContent = '';
    d.recent.forEach(function (r) {
      var tr = el('tr');
      [new Date(r.created_at).toLocaleString('it-IT'), r.kind === 'click' ? 'Click' : 'Visita', r.kind === 'click' ? link(r.link) : '—', PAGES[r.page] || r.page, country(r.country)].forEach(function (c) { tr.appendChild(el('td', '', c)); });
      tb.appendChild(tr);
    });
  }

  /* ---------- schermate ---------- */
  function showLogin(msg) { $('dash').hidden = true; $('login').hidden = false; $('er').textContent = msg || ''; }
  function refresh() {
    $('de').textContent = '';
    load(+$('rg').value).then(function (d) { $('login').hidden = true; $('dash').hidden = false; render(d); })
      .catch(function (e) {
        if (e.message === 'auth') showLogin();
        else if (e.message === 'forbidden') { sessionStorage.removeItem('bq-s'); showLogin('Questo account non è autorizzato.'); }
        else { $('login').hidden = true; $('dash').hidden = false; $('de').textContent = e.message; }
      });
  }
  $('lf').onsubmit = function (e) {
    e.preventDefault(); $('er').textContent = '';
    auth({ email: $('em').value, password: $('pw').value }, 'password').then(function () { $('pw').value = ''; refresh(); })
      .catch(function (x) { $('er').textContent = x.message; });
  };
  $('rg').onchange = $('rf').onclick = refresh;
  $('lo').onclick = function () { sessionStorage.removeItem('bq-s'); showLogin(); };
  if (!/^https:\/\/[a-z0-9]{8,}\.supabase\.co$/.test(U)) showLogin('Prima compila config.js con l’indirizzo e la chiave pubblica di Supabase.');
  else if (sessionStorage.getItem('bq-s')) refresh();
})();

</script>
</body>
</html>
